name: Feishu user OAuth inventory (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check personal Feishu folder using user authorization
        env:
          FEISHU_USER_ACCESS_TOKEN: ${{ secrets.FEISHU_USER_ACCESS_TOKEN }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
        run: python scripts/feishu_user_inventory.py

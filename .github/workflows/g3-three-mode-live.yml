name: Zhixu G3 live three-mode acceptance
on:
  push:
    branches: [deploy/cloudflare-vinext-preview-v1]
    paths:
      - 'web/src/app/ui-lab/plan-modes/**'
      - 'web/src/app/learn/plans/**'
      - 'web/src/components/CoursePlanStudio.tsx'
      - 'web/src/lib/course-plan-view.mjs'
      - '.github/workflows/g3-three-mode-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-three-mode:
    name: Actual Cloudflare three-mode, shared mastery and private protection
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: web
    env:
      ZHIXU_PREVIEW_ORIGIN: https://zhixu-learning-hub-preview.colddreams.workers.dev
      ZHIXU_PREVIEW_OUT: ../g3-three-mode-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for successful new Worker deployment
        shell: bash
        run: |
          for i in {1..65};do
            status=$(curl -s --max-time 10 -o /tmp/g3-live.html -w '%{http_code}' "$ZHIXU_PREVIEW_ORIGIN/ui-lab/plan-modes/" || true)
            if [ "$status" = 200 ] && grep -q '一份资料' /tmp/g3-live.html;then break;fi
            echo "Attempt ${i}, HTTP ${status}";sleep 10
          done
          test "$status" = 200
          grep -q '一份资料' /tmp/g3-live.html
          protected=$(curl -s -o /dev/null -w '%{http_code}' "$ZHIXU_PREVIEW_ORIGIN/learn/plans/")
          test "$protected" = 307 || test "$protected" = 308
          api=$(curl -s -o /dev/null -w '%{http_code}' "$ZHIXU_PREVIEW_ORIGIN/api/course-plans/")
          test "$api" = 401
          echo "Live: public 200, private redirect, unauthorized API 401"
      - name: Prepare Chrome / fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-microhei
          fc-cache -f
      - name: Test real site Chrome 1440 / 768 / 390 and reload mastery
        run: CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/capture-g3-three-mode.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhixu-g3-live-three-mode-screenshots
          path: g3-three-mode-live/
          if-no-files-found: warn
          retention-days: 14

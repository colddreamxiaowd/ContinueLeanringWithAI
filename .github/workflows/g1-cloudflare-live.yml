name: Zhixu G1 Cloudflare live production acceptance

on:
  push:
    branches:
      - deploy/cloudflare-vinext-preview-v1
    paths:
      - 'web/src/app/learn/**'
      - 'web/src/lib/private-course-view.mjs'
      - '.github/workflows/g1-cloudflare-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    name: Verify updated public Worker /learn and unchanged demo
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: web
        shell: bash
    env:
      ZHIXU_PREVIEW_ORIGIN: https://zhixu-learning-hub-preview.colddreams.workers.dev
      ZHIXU_PREVIEW_OUT: ../g1-cloudflare-live-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the new G1 Worker revision to be served publicly
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /tmp/g1-live-learn.html -w '%{http_code}' --max-time 15 "$ZHIXU_PREVIEW_ORIGIN/learn/" || true)
            echo "G1 /learn/ attempt ${i}: HTTP ${code}"
            if [ "$code" = 307 ] || [ "$code" = 308 ]; then
              location=$(curl -s -I -L --max-redirs 0 "$ZHIXU_PREVIEW_ORIGIN/learn/" | tr -d '\r' | grep -i '^location:' || true)
              if echo "$location" | grep -q '/login'; then
                echo "Public G1 /learn/ is deployed: auth-protected redirect is correct"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::New G1 auth-protected route is not yet publicly served"
          head -c 900 /tmp/g1-live-learn.html || true
          exit 1
      - name: Verify original three live pages still respond
        run: |
          for page in home reader practice; do
            code=$(curl -s --max-time 15 -o "/tmp/g1-live-${page}.html" -w '%{http_code}' "$ZHIXU_PREVIEW_ORIGIN/ui-lab/integrated/${page}/")
            echo "${page}: HTTP ${code}"
            test "$code" = 200
          done
      - name: Ensure Google Chrome and Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-microhei
          fc-cache -f
          command -v google-chrome || command -v chromium
      - name: Verify actual Cloudflare public URLs in Chrome 1440/768/390
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/capture-zhixu-unified.mjs
      - name: Upload public G1 rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-cloudflare-live-browser
          path: g1-cloudflare-live-preview/
          if-no-files-found: warn
          retention-days: 14

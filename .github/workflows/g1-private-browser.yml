name: G1 private CoursePack — synthetic browser acceptance

on:
  pull_request:
    paths:
      - 'web/src/app/learn/**'
      - 'web/src/lib/private-course-view.mjs'
      - 'web/src/components/coursepack-client.tsx'
      - 'web/src/design/pixel-pop/workstreams/learning/StackPlayground.tsx'
      - 'web/scripts/capture-g1-private.mjs'
      - '.github/workflows/g1-private-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify synthetic browser runner syntax
        run: node --check web/scripts/capture-g1-private.mjs
      - name: Install existing packages
        working-directory: web
        run: npm ci
      - name: Compile actual Next.js application (local fake Supabase URL)
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3456
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-public-key
          SUPABASE_SECRET_KEY: sb_secret_synthetic_only
        run: npm run build
      - name: Start actual Next.js production server
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3456
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-public-key
          SUPABASE_SECRET_KEY: sb_secret_synthetic_only
        run: |
          npx next start --hostname 127.0.0.1 --port 3001 > /tmp/g1-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/ui-lab/integrated/home -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/g1-next.log
          exit 1
      - name: Ensure Chromium and Chinese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-microhei
          fc-cache -f
          command -v google-chrome || command -v chromium
      - name: Exercise stored synthetic CoursePack; capture 3 sizes
        working-directory: web
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/capture-g1-private.mjs
      - name: Upload G1 browser evidence (SYNTHETIC backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-private-synthetic-chromium
          path: g1-private-preview/
          retention-days: 14
          if-no-files-found: warn

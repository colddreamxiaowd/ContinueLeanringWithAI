name: V4.4 web tests

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/v44-web-tests.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/v44-web-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Model tests
        run: npm run test:models

      - name: V3 algorithm tests
        run: npm run test:v3

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # No deployment, publishing, Feishu call, or secret usage in this workflow.

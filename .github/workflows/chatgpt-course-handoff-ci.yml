name: Zhixu ChatGPT course handoff — private source, JSON import and 3-device UX
on:
  push:
    branches:
      - feat/chatgpt-course-handoff-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Next.js + source/contract tests + two-user HTTP + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3456
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
      SUPABASE_SECRET_KEY: sb_secret_synthetic_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:v45
      - run: npm run test:library
      - run: npm run typecheck
      - run: npm run build
      - name: Real Next.js HTTP — two synthetic users and private original-file denial
        run: node scripts/test-g3-private-http.mjs
  workerd:
    name: Workerd + actual Chrome 3 viewport ChatGPT handoff
    runs-on: ubuntu-latest
    timeout-minutes: 21
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3456
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
      SUPABASE_SECRET_KEY: sb_secret_synthetic_only
      ZHIXU_PREVIEW_ORIGIN: http://127.0.0.1:3001
      ZHIXU_PREVIEW_OUT: ../chatgpt-course-handoff-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vinext check
      - run: npm run build:vinext
      - name: Start real Worker and confirm private user source boundary
        shell: bash
        run: |
          npm run start:vinext -- --host 127.0.0.1 --port 3001 > /tmp/gpt-bridge-workerd.log 2>&1 &
          for i in {1..45}; do
            status=$(curl -s --max-time 4 -o /tmp/zhixu-handoff.html -w '%{http_code}' http://127.0.0.1:3001/ui-lab/plan-modes/ || true)
            if [ "$status" = 200 ]; then break; fi
            sleep 2
          done
          test "$status" = 200 || { tail -100 /tmp/gpt-bridge-workerd.log;exit 1; }
          grep -q 'CHATGPT PROJECT' /tmp/zhixu-handoff.html
          private=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/learn/gpt-handoff/)
          test "$private" = 307 || test "$private" = 308
          download=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/library/items/11111111-1111-4111-8111-111111111111/original)
          test "$download" = 401
          echo "ChatGPT bridge demo 200; private handoff redirect; original file anonymous 401."
      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-microhei
          fc-cache -f
      - name: Real Chromium — export packet and preserve mastery, desktop/tablet/mobile
        run: CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/capture-g3-three-mode.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhixu-chatgpt-course-handoff-browser
          path: chatgpt-course-handoff-qa/
          if-no-files-found: warn
          retention-days: 14

name: V4.2 PPTX content tests

on:
  push:
    branches:
      - main
      - feat/v42-pptx-content
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install V4.2 test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v42.txt
      - name: Run all unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

name: Pixel Pop B — browser screenshots

on:
  pull_request:
    paths:
      - "web/src/app/ui-lab/session-b/**"
      - "web/src/design/pixel-pop/workstreams/dashboard/**"
      - "web/scripts/capture-pixel-pop-session-b.mjs"
      - ".github/workflows/pixel-pop-b-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build actual Next.js site
        working-directory: web
        run: npm run build
      - name: Launch preview app
        working-directory: web
        run: |
          npx next start --hostname 127.0.0.1 --port 3001 > /tmp/pixel-pop-next.log 2>&1 &
          echo $! > /tmp/pixel-pop-next.pid
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3001/ui-lab/session-b -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pixel-pop-next.log
          exit 1
      - name: Verify Chrome is installed
        run: |
          which google-chrome || which google-chrome-stable || which chromium
      - name: Capture real responsive screenshots
        working-directory: web
        env:
          PREVIEW_OUT: ../ui-preview-b
          PREVIEW_URL: http://127.0.0.1:3001/ui-lab/session-b
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/capture-pixel-pop-session-b.mjs
      - name: Upload browser screenshots and validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-pop-session-b-nextjs-preview
          path: ui-preview-b/
          if-no-files-found: warn
          retention-days: 14

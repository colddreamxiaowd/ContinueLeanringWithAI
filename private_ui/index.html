<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>私有资料 · 知序 Learning Hub</title>
  <link rel="stylesheet" href="/private/styles.css">
  <script src="/private/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">知序 <span>Learning Hub</span></a>
    <span class="local-badge">仅本机访问</span>
  </header>
  <main class="shell">
    <section class="intro">
      <p class="eyebrow">V4.6 · LOCAL PRIVATE ACCESS</p>
      <h1>私有资料空间</h1>
      <p class="lede">资料由本机内容存储提供。访问令牌只用于登录，不会保存在浏览器存储中。</p>
    </section>

    <section id="login-panel" class="panel">
      <h2>验证身份</h2>
      <p class="muted">输入本机环境变量 CLAI_PRIVATE_ACCESS_TOKEN 对应的访问令牌。</p>
      <form id="login-form">
        <label for="access-token">访问令牌</label>
        <input id="access-token" name="token" type="password" autocomplete="current-password" required>
        <button type="submit">登录并读取资料</button>
      </form>
    </section>

    <section id="library-panel" class="library hidden" aria-live="polite">
      <div class="library-head">
        <div>
          <p class="eyebrow">PRIVATE LIBRARY</p>
          <h2>本机资料</h2>
        </div>
        <button id="logout-button" class="secondary" type="button">注销</button>
      </div>
      <p id="status-message" class="status" role="status"></p>
      <div class="library-grid">
        <nav id="document-list" class="document-list" aria-label="资料列表"></nav>
        <article id="document-detail" class="document-detail">
          <div class="empty-state">
            <span class="empty-mark">↳</span>
            <h3>选择一份资料</h3>
            <p>详情只会在通过认证后从本机服务读取。</p>
          </div>
        </article>
      </div>
    </section>
    <p id="global-message" class="status" role="status"></p>
    <footer>本地个人访问原型 · 不代表互联网多用户生产认证服务</footer>
  </main>
</body>
</html>

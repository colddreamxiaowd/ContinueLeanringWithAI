name: Pixel Pop D — Next.js interaction screenshots

on:
  pull_request:
    paths:
      - "web/src/app/ui-lab/session-d/**"
      - "web/src/design/pixel-pop/workstreams/learning/**"
      - "web/scripts/capture-pixel-pop-session-d.mjs"
      - ".github/workflows/pixel-pop-d-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck real UI
        working-directory: web
        run: npm run typecheck
      - name: Build actual Next.js site
        working-directory: web
        run: npm run build
      - name: Launch real preview
        working-directory: web
        run: |
          npx next start --hostname 127.0.0.1 --port 3001 > /tmp/pixel-pop-d-next.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3001/ui-lab/session-d -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/pixel-pop-d-next.log
          exit 1
      - name: Install Chinese fonts
        run: |
          if fc-list :lang=zh family | grep -iq 'Noto Sans CJK'; then
            echo 'CJK fonts already present'
          else
            sudo apt-get install -y fonts-noto-cjk
          fi
          fc-cache -f
          fc-match 'Noto Sans CJK SC'
      - name: Capture real Chromium screens and execute interactions
        working-directory: web
        env:
          PREVIEW_OUT: ../ui-preview-d
          PREVIEW_URL: http://127.0.0.1:3001/ui-lab/session-d
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/capture-pixel-pop-session-d.mjs
      - name: Upload actual screenshots and test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-pop-session-d-nextjs-preview
          path: ui-preview-d/
          if-no-files-found: warn
          retention-days: 14
